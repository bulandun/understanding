        if (chosenContext &amp;&amp; expectedPrefix &amp;&amp; contextRound &lt; chosenContext.rounds.length) {
          const round = chosenContext.rounds[contextRound];
          return round.map(([token, probability]) =&gt; ({ token, probability }));
        }
        return customCandidates(promptInput.value);
      }

      function setStage(index, options = {}) {
        activeStage = Math.max(0, Math.min(stages.length - 1, index));
        const data = stages[activeStage];
        stageTitle.textContent = data.title;
        stageCount.textContent = data.count;
        stageDetail.textContent = data.detail;
        humanDetail.textContent = data.human;
        tabButtons.forEach((button, buttonIndex) =&gt; {
          const selected = buttonIndex === activeStage;
          button.classList.toggle(&#x27;active&#x27;, selected);
          button.setAttribute(&#x27;aria-selected&#x27;, selected ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        stagePanel.setAttribute(&#x27;aria-labelledby&#x27;, `llm-tab-${activeStage}`);
        targetViewCenterX = stageViews[activeStage].x;
        targetViewZoom = stageViews[activeStage].zoom;
        if (!options.quiet) status.textContent = `${data.title}. Drag the model to inspect it.`;
        draw();
      }

      function startTour() {
        if (tourPlaying) {
          stopTour(&#x27;Guided tour paused.&#x27;);
          return;
        }
        tourPlaying = true;
        tourButton.innerHTML = &#x27;&lt;i data-lucide=&quot;pause&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Pause tour&#x27;;
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        let next = activeStage === 4 ? 1 : Math.max(1, activeStage + 1);
        setStage(next);
        status.textContent = `Guided tour: ${stages[next].title}`;
        tourTimer = window.setInterval(() =&gt; {
          next += 1;
          if (next &gt; 4) {
            stopTour(&#x27;Tour complete — generate a token to see the loop continue.&#x27;);
            return;
          }
          setStage(next, { quiet: true });
          status.textContent = `Guided tour: ${stages[next].title}`;
        }, reducedMotion ? 4200 : 3000);
      }

      function stopTour(message) {
        if (tourTimer) window.clearInterval(tourTimer);
        tourTimer = null;
        tourPlaying = false;
        tourButton.innerHTML = &#x27;&lt;i data-lucide=&quot;play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Guide me&#x27;;
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        if (message) status.textContent = message;
      }

      function weightedChoice(items) {
        const chosenContext = contexts[contextSelect.value];
        if (chosenContext &amp;&amp; promptInput.value.startsWith(chosenContext.prompt) &amp;&amp; contextRound &lt; chosenContext.rounds.length) {
          return [...items].sort((a, b) =&gt; b.probability - a.probability)[0];
        }
        const seed = hashText(promptInput.value + String(contextRound));
        let cursor = (seed % 1000) / 1000;
        for (const item of items) {
          cursor -= item.probability;
          if (cursor &lt;= 0) return item;
        }
        return items[0];
      }

      function generateToken(chosenCandidate) {
        if (generateButton.disabled) return;
        stopTour();
        setStage(4, { quiet: true });
        candidates = currentCandidates();
        const selected = chosenCandidate || weightedChoice(candidates);
        selectedToken = selected.token;
        generationPulse = 1;
        animationStart = performance.now();
        generateButton.disabled = true;
        status.textContent = &#x27;Selecting the highest-probability token…&#x27;;
        draw();
        window.setTimeout(() =&gt; {
          const punctuation = /^[.,!?;:]$/.test(selected.token);
          promptInput.value = `${promptInput.value}${punctuation ? &#x27;&#x27; : &#x27; &#x27;}${selected.token}`;
          contextRound += 1;
          status.textContent = `Selected “${selected.token}” (${Math.round(selected.probability * 100)}%). It now becomes part of the context.`;
          generateButton.disabled = false;
          generationPulse = 0;
          candidates = currentCandidates();
          selectedToken = &#x27;&#x27;;
          draw();
        }, reducedMotion ? 250 : 1050);
      }

      function updateCanvasSize() {
        const rect = wrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(320, Math.round(rect.width));
        const height = Math.max(400, Math.round(rect.height));
        const pixelWidth = Math.round(width * dpr);
        const pixelHeight = Math.round(height * dpr);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        canvasDimensions = { width, height, dpr };
      }

      function rotatePoint(point) {
        const cy = Math.cos(yaw);
        const sy = Math.sin(yaw);
        const cp = Math.cos(pitch);
        const sp = Math.sin(pitch);
        const x1 = point.x * cy - point.z * sy;
        const z1 = point.x * sy + point.z * cy;
        const y1 = point.y * cp - z1 * sp;
        const z2 = point.y * sp + z1 * cp;
        return { x: x1, y: y1, z: z2 };
      }

      function project(point, width, height) {
        const p = rotatePoint(point);
        const camera = 9.2;
        const depth = Math.max(3.8, camera - p.z);
        const scale = Math.min(width / 9.2, height / 6.1) * (camera / depth) * viewZoom;
        return {
          x: width * 0.5 + (p.x - viewCenterX) * scale,
          y: height * 0.52 - p.y * scale,
          z: p.z,
          scale: camera / depth
        };
      }

      function line3D(a, b, color, alpha, width, dims) {
        const pa = project(a, dims.width, dims.height);
        const pb = project(b, dims.width, dims.height);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
        ctx.restore();
      }

      function circle3D(point, radius, fill, alpha, dims, stroke) {
        const p = project(point, dims.width, dims.height);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = fill;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(2.2, radius * p.scale), 0, Math.PI * 2);
        ctx.fill();
        if (stroke) {
          ctx.globalAlpha = Math.min(1, alpha + 0.2);
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.restore();
        return p;
      }

      function label(text, x, y, color, align = &#x27;center&#x27;, weight = 500, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.font = `${weight} 12px system-ui, sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = &#x27;middle&#x27;;
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function roundedLabel(text, p, colors, fillColor, highlighted = false, alpha = 1) {
        ctx.save();
        ctx.font = &#x27;500 12px system-ui, sans-serif&#x27;;
        const textWidth = ctx.measureText(text).width;
        const width = Math.max(32, textWidth + 16);
        const height = 25;
        ctx.globalAlpha = (highlighted ? 0.98 : 0.84) * alpha;
        ctx.fillStyle = fillColor;
        ctx.beginPath();
        ctx.roundRect(p.x - width / 2, p.y - height / 2, width, height, 8);
        ctx.fill();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = highlighted ? colors.primaryForeground : colors.foreground;
        ctx.textAlign = &#x27;center&#x27;;
        ctx.textBaseline = &#x27;middle&#x27;;
        ctx.fillText(text, p.x, p.y + 0.5);
        ctx.restore();
        return { x: p.x - width / 2, y: p.y - height / 2, width, height };
      }

      function stageHeading(title, explanation, point, alpha, dims, colors) {
        const p = project(point, dims.width, dims.height);
        label(title, p.x, p.y, colors.foreground, &#x27;center&#x27;, 650, alpha);
        if (dims.width &gt;= 820 || activeStage !== 0) {
          label(explanation, p.x, p.y + 19, colors.mutedForeground, &#x27;center&#x27;, 400, alpha);
        }
      }

      function stageAlpha(stageNumber) {
        if (activeStage === 0) return 1;
        return activeStage === stageNumber ? 1 : 0.16;
      }

      function drawBackdrop(dims, colors) {
        ctx.save();
        ctx.clearRect(0, 0, dims.width, dims.height);
        const cx = dims.width * 0.5;
        const cy = dims.height * 0.52;
        for (let r = 60; r &lt; Math.max(dims.width, dims.height); r += 58) {
          ctx.globalAlpha = 0.07;
          ctx.strokeStyle = colors.border;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawTokens(dims, colors, time) {
        const words = tokenize(promptInput.value);
        const count = words.length;
        const alpha = stageAlpha(1);
        const positions = [];
        words.forEach((word, i) =&gt; {
          const angle = (i / Math.max(1, count)) * Math.PI * 2 - Math.PI / 2;
          const point = {
            x: -3.25,
            y: Math.sin(angle) * 1.65,
            z: Math.cos(angle) * 1.3
          };
          positions.push(point);
          const p = project(point, dims.width, dims.height);
          const highlighted = activeStage === 1 &amp;&amp; hoverItem &amp;&amp; hoverItem.type === &#x27;token&#x27; &amp;&amp; hoverItem.index === i;
          const box = roundedLabel(word, p, colors, highlighted ? colors.primary : colors.surface, highlighted, alpha);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = colors.series1;
          ctx.beginPath();
          ctx.arc(p.x - box.width / 2 + 4, p.y, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          projectedHitAreas.push({ ...box, type: &#x27;token&#x27;, index: i, label: `Token “${word}” becomes a numerical vector.` });
        });

        const end = { x: -2.25, y: 0, z: 0 };
        positions.forEach((point, i) =&gt; {
          const wave = 0.5 + 0.5 * Math.sin(time * 0.0018 + i);
          line3D(point, end, colors.series1, alpha * (0.15 + wave * 0.18), 1, dims);
        });
        stageHeading(&#x27;TOKENS&#x27;, &#x27;Text pieces become number vectors&#x27;, { x: -3.25, y: 2.35, z: 0 }, alpha, dims, colors);
        return positions;
      }

      function drawAttention(tokenPositions, dims, colors, time) {
        const alpha = stageAlpha(2);
        const focus = { x: -1.45, y: 0, z: 0 };
        const attentionPoints = tokenPositions.map((point, i) =&gt; ({
          x: -1.45,
          y: point.y * 0.86,
          z: point.z * 0.86,
          weight: 0.22 + ((hashText(promptInput.value + i) % 70) / 100)
        }));
        for (let i = 0; i &lt; attentionPoints.length; i += 1) {
          for (let j = i + 1; j &lt; attentionPoints.length; j += 1) {
            const strength = ((i * 13 + j * 7 + hashText(promptInput.value)) % 100) / 100;
            if (strength &gt; 0.56) {
              const pulse = 0.55 + 0.45 * Math.sin(time * 0.0022 + i * 0.7 + j);
              line3D(attentionPoints[i], attentionPoints[j], colors.series2, alpha * (0.08 + strength * 0.22 * pulse), 0.7 + strength * 1.3, dims);
            }
          }
        }
        attentionPoints.forEach((point, i) =&gt; {
          circle3D(point, 4.1 + point.weight * 3.1, colors.series2, alpha * (0.45 + point.weight * 0.35), dims);
          if (i &lt; tokenPositions.length) line3D(tokenPositions[i], point, colors.series2, alpha * 0.16, 1, dims);
        });
        const p = circle3D(focus, 10, colors.series2, alpha * 0.3, dims, colors.series2);
        projectedHitAreas.push({ x: p.x - 25, y: p.y - 25, width: 50, height: 50, type: &#x27;attention&#x27;, label: &#x27;Attention changes which earlier tokens matter for the current prediction.&#x27; });
        stageHeading(&#x27;ATTENTION&#x27;, &#x27;Which tokens matter to each other?&#x27;, { x: -1.45, y: 2.35, z: 0 }, alpha, dims, colors);
        return attentionPoints;
      }

      function drawLayers(attentionPoints, dims, colors, time) {
        const alpha = stageAlpha(3);
        const ringXs = [-0.3, 0.48, 1.26];
        const ringNodes = [];
        ringXs.forEach((x, layerIndex) =&gt; {
          const ring = [];
          const count = 18;
          for (let i = 0; i &lt; count; i += 1) {
            const angle = (i / count) * Math.PI * 2;
            const wobble = Math.sin(time * 0.001 + i * 1.9 + layerIndex) * 0.08;
            const point = { x, y: Math.sin(angle) * (1.48 + wobble), z: Math.cos(angle) * (1.48 + wobble) };
            ring.push(point);
            const intensity = 0.26 + 0.45 * (0.5 + 0.5 * Math.sin(time * 0.002 + i * 0.58 - layerIndex));
            circle3D(point, 3.2, colors.series3, alpha * intensity, dims);
            if (i &gt; 0) line3D(ring[i - 1], point, colors.series3, alpha * 0.12, 1, dims);
          }
          line3D(ring[ring.length - 1], ring[0], colors.series3, alpha * 0.12, 1, dims);
          ringNodes.push(ring);
        });

        attentionPoints.forEach((point, i) =&gt; {
          line3D(point, ringNodes[0][(i * 2) % ringNodes[0].length], colors.series3, alpha * 0.12, 1, dims);
        });
        for (let layer = 0; layer &lt; ringNodes.length - 1; layer += 1) {
          for (let i = 0; i &lt; ringNodes[layer].length; i += 3) {
            line3D(ringNodes[layer][i], ringNodes[layer + 1][(i + 2) % ringNodes[layer + 1].length], colors.series3, alpha * 0.15, 1, dims);
          }
        }
        const p = project({ x: 0.48, y: 0, z: 0 }, dims.width, dims.height);
        projectedHitAreas.push({ x: p.x - 42, y: p.y - 42, width: 84, height: 84, type: &#x27;layer&#x27;, label: &#x27;Each ring stands for many learned transformations inside a transformer block.&#x27; });
        stageHeading(&#x27;TRANSFORMER BLOCKS&#x27;, &#x27;Repeatedly update every vector&#x27;, { x: 0.48, y: 2.35, z: 0 }, alpha, dims, colors);
        return ringNodes[ringNodes.length - 1];
      }

      function drawCandidates(lastRing, dims, colors, time) {
        const alpha = stageAlpha(4);
        const sorted = [...candidates].sort((a, b) =&gt; b.probability - a.probability).slice(0, 6);
        const max = sorted[0] ? sorted[0].probability : 1;
        const anchor = { x: 2.25, y: 0, z: 0 };
        lastRing.filter((_, i) =&gt; i % 3 === 0).forEach((point, i) =&gt; {
          line3D(point, anchor, colors.series4, alpha * (0.08 + i * 0.01), 1, dims);
        });
        const anchorP = circle3D(anchor, 8, colors.series4, alpha * 0.48, dims, colors.series4);
        projectedHitAreas.push({ x: anchorP.x - 24, y: anchorP.y - 24, width: 48, height: 48, type: &#x27;logits&#x27;, label: &#x27;The final vector is converted into scores for tokens in the vocabulary.&#x27; });

        sorted.forEach((candidate, i) =&gt; {
          const angle = -1.22 + i * 0.49;
          const radius = 1.2 + (candidate.probability / max) * 0.62;
          const point = {
            x: 3.25,
            y: Math.sin(angle) * radius,
            z: Math.cos(angle) * radius
          };
          const isSelected = selectedToken === candidate.token;
          const pulse = isSelected ? 1 + Math.sin(time * 0.012) * 0.18 : 1;
          line3D(anchor, point, colors.series4, alpha * (0.13 + candidate.probability * 0.7), 1 + candidate.probability * 4, dims);
          const p = circle3D(point, (5 + candidate.probability * 18) * pulse, isSelected ? colors.primary : colors.series4, alpha * (0.48 + candidate.probability), dims, isSelected ? colors.primaryForeground : undefined);
          const percent = `${Math.round(candidate.probability * 100)}%`;
          const placeLeft = p.x &gt; dims.width - 105;
          const textX = p.x + (placeLeft ? -12 - candidate.probability * 8 : 12 + candidate.probability * 8);
          const textAlign = placeLeft ? &#x27;right&#x27; : &#x27;left&#x27;;
          label(candidate.token, textX, p.y - 7, colors.foreground, textAlign, 500, alpha);
          label(percent, textX, p.y + 8, colors.mutedForeground, textAlign, 400, alpha);
          projectedHitAreas.push({ x: placeLeft ? p.x - 92 : p.x - 18, y: p.y - 18, width: 110, height: 38, type: &#x27;candidate&#x27;, token: candidate.token, label: `“${candidate.token}” has an illustrative probability of ${percent}.` });
        });
        stageHeading(&#x27;NEXT-TOKEN DISTRIBUTION&#x27;, &#x27;Probability of each possible next token&#x27;, { x: 3.15, y: 2.35, z: 0 }, alpha, dims, colors);
      }

      function drawFlow(dims, colors, time) {
        if (activeStage !== 0 &amp;&amp; !generationPulse) return;
        const progress = generationPulse ? Math.min(1, (time - animationStart) / (reducedMotion ? 220 : 950)) : ((time * 0.00009) % 1);
        const startX = -3.1;
        const endX = 3.18;
        const point = { x: startX + (endX - startX) * progress, y: 0, z: 0 };
        const p = project(point, dims.width, dims.height);
        ctx.save();
        ctx.globalAlpha = generationPulse ? 0.95 : 0.45;
        ctx.fillStyle = colors.primary;
        ctx.beginPath();
        ctx.arc(p.x, p.y, generationPulse ? 7 : 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function renderFrame(now) {
        animationFrame = null;
        if (!canvasDimensions.width) updateCanvasSize();
        if (!canvasColors) refreshPalette();
        const dims = canvasDimensions;
        const colors = canvasColors;
        yaw += (targetYaw - yaw) * 0.12;
        pitch += (targetPitch - pitch) * 0.12;
        viewCenterX += (targetViewCenterX - viewCenterX) * 0.11;
        viewZoom += (targetViewZoom - viewZoom) * 0.11;
        projectedHitAreas = [];
        drawBackdrop(dims, colors);
        const tokenPositions = drawTokens(dims, colors, now);
        const attentionPoints = drawAttention(tokenPositions, dims, colors, now);
        const lastRing = drawLayers(attentionPoints, dims, colors, now);
        drawCandidates(lastRing, dims, colors, now);
        drawFlow(dims, colors, now);

        if (hoverItem) {
          const found = projectedHitAreas.find(item =&gt; item.type === hoverItem.type &amp;&amp; (item.index === hoverItem.index || item.token === hoverItem.token || (!item.index &amp;&amp; !item.token)));
          if (found) status.textContent = found.label;
        }

        const settling = Math.abs(targetYaw - yaw) &gt; 0.002 || Math.abs(targetPitch - pitch) &gt; 0.002 || Math.abs(targetViewCenterX - viewCenterX) &gt; 0.004 || Math.abs(targetViewZoom - viewZoom) &gt; 0.002;
        const ambientMotion = !reducedMotion &amp;&amp; document.visibilityState !== &#x27;hidden&#x27;;
        if (ambientMotion || dragging || settling || generationPulse) {
          draw();
        }
      }

      function draw() {
        if (animationFrame !== null) return;
        animationFrame = window.requestAnimationFrame(renderFrame);
      }

      function pointerPosition(event) {
        return { x: event.offsetX, y: event.offsetY };
      }

      canvas.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
        dragging = true;
        pointerMoved = false;
        dragStart = { ...pointerPosition(event), yaw: targetYaw, pitch: targetPitch };
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
        const pos = pointerPosition(event);
        if (dragging &amp;&amp; dragStart) {
          if (Math.abs(pos.x - dragStart.x) + Math.abs(pos.y - dragStart.y) &gt; 5) pointerMoved = true;
          targetYaw = Math.max(-0.58, Math.min(0.58, dragStart.yaw + (pos.x - dragStart.x) * 0.004));
          targetPitch = Math.max(-0.3, Math.min(0.3, dragStart.pitch + (pos.y - dragStart.y) * 0.003));
          draw();
          return;
        }
        const hit = [...projectedHitAreas].reverse().find(item =&gt; pos.x &gt;= item.x &amp;&amp; pos.x &lt;= item.x + item.width &amp;&amp; pos.y &gt;= item.y &amp;&amp; pos.y &lt;= item.y + item.height);
        hoverItem = hit ? { type: hit.type, index: hit.index, token: hit.token } : null;
        canvas.style.cursor = hit ? &#x27;pointer&#x27; : &#x27;grab&#x27;;
        if (hit) status.textContent = hit.label;
        else status.textContent = stages[activeStage].title + &#x27;. Drag the model to inspect it.&#x27;;
      });

      function endDrag(event) {
        if (dragging &amp;&amp; canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        dragging = false;
        dragStart = null;
      }

      canvas.addEventListener(&#x27;pointerup&#x27;, endDrag);
      canvas.addEventListener(&#x27;pointercancel&#x27;, endDrag);
      canvas.addEventListener(&#x27;pointerleave&#x27;, event =&gt; {
        if (dragging) endDrag(event);
        hoverItem = null;
      });

      canvas.addEventListener(&#x27;click&#x27;, event =&gt; {
        if (pointerMoved) return;
        const pos = pointerPosition(event);
        const hit = [...projectedHitAreas].reverse().find(item =&gt; pos.x &gt;= item.x &amp;&amp; pos.x &lt;= item.x + item.width &amp;&amp; pos.y &gt;= item.y &amp;&amp; pos.y &lt;= item.y + item.height);
        if (!hit) return;
        if (hit.type === &#x27;candidate&#x27;) {
          const candidate = candidates.find(item =&gt; item.token === hit.token);
          if (candidate) generateToken(candidate);
          return;
        }
        const stageByType = { token: 1, attention: 2, layer: 3, logits: 4 };
        if (stageByType[hit.type]) {
          stopTour();
          setStage(stageByType[hit.type]);
        }
      });

      tabButtons.forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          stopTour();
          setStage(Number(button.dataset.step));
        });
        button.addEventListener(&#x27;keydown&#x27;, event =&gt; {
          if (![&#x27;ArrowLeft&#x27;, &#x27;ArrowRight&#x27;, &#x27;Home&#x27;, &#x27;End&#x27;].includes(event.key)) return;
          event.preventDefault();
          const current = tabButtons.indexOf(button);
          const next = event.key === &#x27;Home&#x27; ? 0 : event.key === &#x27;End&#x27; ? tabButtons.length - 1 : (current + (event.key === &#x27;ArrowRight&#x27; ? 1 : -1) + tabButtons.length) % tabButtons.length;
          tabButtons[next].focus();
          tabButtons[next].click();
        });
      });

      contextSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
        const context = contexts[contextSelect.value];
        promptInput.value = context.prompt;
        contextRound = 0;
        selectedToken = &#x27;&#x27;;
        candidates = currentCandidates();
        status.textContent = &#x27;Context changed. Notice how the next-token distribution changes.&#x27;;
        draw();
      });

      generateButton.addEventListener(&#x27;click&#x27;, () =&gt; generateToken());
      tourButton.addEventListener(&#x27;click&#x27;, startTour);
      resetButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        stopTour();
        targetYaw = -0.08;
        targetPitch = -0.04;
        setStage(0);
        status.textContent = &#x27;Whole process restored. Click any part to focus on it.&#x27;;
      });

      const resizeObserver = new ResizeObserver(() =&gt; {
        updateCanvasSize();
        draw();
      });
      resizeObserver.observe(wrap);
      const themeObserver = new MutationObserver(() =&gt; {
        refreshPalette();
        draw();

      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
